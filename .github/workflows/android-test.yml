name: android-test

# Instrumented tests on a real emulator. macOS runners provide hardware
# acceleration (HVF) for Android emulators; ubuntu-hosted runners do not, and
# an arm64 image there is unusable without KVM. macos-14 is Apple Silicon, so
# the emulated device is natively arm64 — the same ABI we ship to most users.

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/android-test.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  API_LEVEL: "34"
  ARCH: "arm64-v8a"
  TARGET: "google_apis"
  PROFILE: "pixel_6"

jobs:
  connected-check:
    name: connected-check (arm64-v8a, API 34)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK, CMake, platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709" "cmake;3.31.6"

      # Same rationale as ci.yml: third-party wrapper jars vendored inside
      # native submodules fail upstream checksum validation; the root wrapper
      # is pinned by hash instead.
      - name: Validate root Gradle Wrapper
        env:
          WRAPPER_JAR_SHA256: e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637
        run: |
          echo "$WRAPPER_JAR_SHA256  gradle/wrapper/gradle-wrapper.jar" | shasum -a 256 --check -

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      # Emulator images plus a booted AVD snapshot are ~2 GB; cache them.
      # Bump the key suffix to rotate.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}-${{ env.PROFILE }}-v1

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          # -gpu host dies on macos-14 with Vulkan/MoltenVK
          # VK_ERROR_OUT_OF_DEVICE_MEMORY (staging buffer alloc); SwiftShader
          # (software GL/Vulkan) is the reliable headless mode on CI and is
          # plenty for the virtualscene camera feed these tests use.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          disable-animations: true
          # connectedAndroidTest uninstalls the APK when it finishes, so the
          # launch smoke reinstalls it. The suite result always wins the exit
          # code; a fatal crash in the smoke launch also fails the run.
          script: |
            ./gradlew :app:connectedArm64-v8aDebugAndroidTest --console=plain --stacktrace
            TEST_EXIT=$?
            mkdir -p smoke-out
            APK=$(ls app/build/outputs/apk/arm64-v8a/debug/*.apk 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              adb install -r "$APK" || true
              adb shell monkey -p app.versta.translate -c android.intent.category.LAUNCHER 1 || true
              sleep 12
              adb exec-out screencap -p > smoke-out/app-launch.png || true
            fi
            adb logcat -d -v threadtime > smoke-out/logcat.txt || true
            if grep -E "FATAL EXCEPTION|ANR in app.versta.translate" smoke-out/logcat.txt; then
              echo "Smoke launch produced a fatal app crash"
              TEST_EXIT=90
            fi
            exit $TEST_EXIT

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/connected_android_test_additional_output/**
            smoke-out/**
          if-no-files-found: ignore
