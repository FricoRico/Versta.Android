name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# One active run per ref: retriggering or pushing again cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # upload-artifact on failure

env:
  JAVA_VERSION: "17"

jobs:
  # Kotlin formatting (ktlint) + static analysis (detekt).
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # AGP needs SDK location even for pure Kotlin checks.
      # setup-android v3 defaults to installing the legacy `tools` package,
      # which Google has removed from the SDK repository manifests; skip it
      # (packages: "") and install exactly what we need in the next step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # --build-cache on every gradlew call in this workflow (NEU-308):
      # the Gradle task-output cache is off by default and gradle.properties
      # deliberately does not set org.gradle.caching (local-dev behavior
      # unchanged), so without the flag every PR re-executes the full
      # Kotlin/javac/lint/test task graph from scratch. Same flag form as the
      # NEU-227 connected-device-tests lane; cache-read-only: false above
      # keeps PR runs able to save their state. FROM-CACHE only ever restores
      # tasks whose inputs are unchanged — source edits still re-execute, and
      # ccache (assemble job, NEU-212) semantics are untouched.
      - name: ktlint
        run: ./gradlew :app:ktlintCheck --console=plain --build-cache

      - name: detekt
        run: ./gradlew :app:detekt --console=plain --build-cache

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: "**/build/reports/detekt/*.sarif"
          if-no-files-found: ignore

  # JVM unit tests (app/src/test) on a single ABI flavor — no emulator, no
  # connected tests. AGP resolves ndkVersion at configuration time because of
  # externalNativeBuild, so the pinned NDK must be installed even though the
  # test task graph never runs a native build.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install platform, build-tools and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Unit tests (arm64-v8a debug)
        run: ./gradlew :app:testArm64-v8aDebugUnitTest --console=plain --build-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/test*UnitTest/**
          if-no-files-found: ignore

  # Android lint on a single ABI flavor (findings are ABI-independent).
  android-lint:
    name: android-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: lint
        run: ./gradlew :app:lintArm64-v8aDebug --console=plain --build-cache

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-*"
          if-no-files-found: ignore

  # Proves the full toolchain (Kotlin + CMake native build) compiles.
  # Kept as a gate so broken native builds never reach develop.
  # The per-flavour abiFilters in app/build.gradle.kts scope this to one
  # architecture; without it every assemble builds all four ABIs.
  #
  # Native-build caching (NEU-183): the vendored inference bridge (MNN,
  # whisper.cpp, leanmt, cld2, neon-sse) cold-compiles
  # in ~5m20s while its inputs only move when a submodule pin or a main-repo
  # file under app/native changes (~monthly), so every Kotlin-only PR would
  # otherwise pay the full cost. Compilation is routed through ccache
  # (installed via apt below — the current ubuntu-latest image no longer
  # ships it) via CMake's CMAKE_<LANG>_COMPILER_LAUNCHER environment
  # variables — no Gradle files involved, no effect outside this job.
  #
  # Cache contract:
  #   path: .ccache (CCACHE_DIR, inside the workspace)
  #   key : ccache-arm64-v8a-<runner.os>-ccache<ver>-ndk28.1.13356709-cmake3.31.6-<nativeHash>
  #         nativeHash = git hash-object of
  #           git ls-tree -r HEAD -- app/native .gitmodules   (minus the
  #           generated graphify-out stat indexes)
  #         which covers every main-repo bridge source AND every submodule
  #         gitlink pin. <ver> is the installed ccache version, so a distro
  #         bump degrades to a clean miss instead of mixing cache formats.
  #         The ndk/cmake segments must track the pins in this job's
  #         sdkmanager step (and app/build.gradle.kts).
  #   No restore-keys on purpose: a native change must show a clean cache
  #   MISS and a full rebuild in the log, not a silent partial restore.
  #   ccache content-hashes its compile inputs, so artifacts can never go
  #   stale under a hit either.
  #   Isolation: GitHub defaults — branch-scoped, PRs restore the base
  #   branch's cache, nothing shared across repos.
  assemble:
    name: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Hash native inputs for the cache key
        id: native-inputs
        run: |
          hash=$(git ls-tree -r HEAD -- app/native .gitmodules | grep -v 'graphify-out' | git hash-object --stdin)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "native inputs hash: $hash"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK, CMake, platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709" "cmake;3.31.6"

      # ccache is NOT on the current ubuntu-latest image (exit 127),
      # so install the distro build; its version joins the cache key.
      - name: Install ccache
        id: ccache-setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
          ver=$(ccache --version | sed -n '1s/.*version //p')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "ccache version: $ver"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-arm64-v8a-${{ runner.os }}-ccache${{ steps.ccache-setup.outputs.version }}-ndk28.1.13356709-cmake3.31.6-${{ steps.native-inputs.outputs.hash }}

      - name: ccache preflight
        run: ccache --zero-stats

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # Validated in the dedicated step below, which can allow-list
          # wrapper JARs vendored inside submodules.
          validate-wrappers: false

      # The MNN submodule vendors a wrapper JAR inside
      # 3rd_party/flatbuffers/samples/android whose checksum is not in the
      # known list. It is a sample project that is never executed here;
      # allow-list its SHA-256 (pinned by the submodule gitlink).
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04

      - name: Assemble debug (arm64-v8a)
        run: ./gradlew :app:assembleArm64-v8aDebug --console=plain --build-cache

      # Release variants are only exercised by the release lane; keep the
      # universal-release Kotlin compile covered per commit so a flavour-
      # scoped dependency gap can't escape to publish time (it did once —
      # universalRelease lacked the vendored ONNX Runtime AAR, 2026-10-14).
      - name: Compile universal release Kotlin
        run: ./gradlew :app:compileUniversalReleaseKotlin --console=plain --build-cache

      # Warm-cache runs must show near-total direct hits here; a hit-rate
      # collapse on an unchanged native tree means the key or launcher
      # wiring regressed.
      - name: ccache stats
        if: always()
        run: |
          ccache --show-config | grep compiler_check
          ccache --show-stats -vv

      # Cheap packaging assertion (NEU-183): the debug APK must carry the
      # freshly built bridge, not a stale/absent one.
      - name: Verify the APK carries the native bridge
        run: |
          apk=app/build/outputs/apk/arm64-v8a/debug/app-arm64-v8a-debug.apk
          test -f "$apk" || { echo "::error::APK not found at $apk"; exit 1; }
          unzip -l "$apk" | grep -E "lib/arm64-v8a/lib.+\.so" || { echo "::error::no arm64-v8a shared library in $apk"; exit 1; }

  # Baked-catalog gate self-check, fully hermetic (NEU-177): runs both gate
  # lanes against committed registry-layout fixtures in
  # app/catalog-gate-fixtures/, whose text-to-speech catalog deliberately
  # advertises an architecture this branch does not know. The tolerant lane
  # (every PR/debug build) must stay green and warn; the strict release lane
  # must fail and name the violation. Never touches the live registry.
  catalog-gate:
    name: catalog-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # AGP resolves ndkVersion at configuration time even for non-native
      # task graphs, so the pinned NDK must be installed here too.
      - name: Install platform, build-tools and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # getRemoteData only re-fetches when res/raw is empty; clear it so each
      # step reads the fixture, not the previous step's leftovers.
      - name: Tolerant lane warns on enum drift
        run: |
          rm -rf app/src/main/res/raw
          ./gradlew :app:validateBakedCatalogs -Pmodels.catalog.override=app/catalog-gate-fixtures --console=plain --build-cache 2>&1 | tee tolerant.log
          grep -q "catalog gate WARNING" tolerant.log || { echo "::error::tolerant lane produced no enum-drift warning"; exit 1; }

      - name: Strict lane fails on enum drift
        run: |
          rm -rf app/src/main/res/raw
          if ./gradlew :app:validateBakedCatalogsStrict -Pmodels.catalog.override=app/catalog-gate-fixtures --console=plain --build-cache > strict.log 2>&1; then
            echo "::error::strict lane passed on a fixture with an unknown VoiceModelArchitecture"
            cat strict.log
            exit 1
          fi
          grep -q "unknown VoiceModelArchitecture" strict.log || { echo "::error::strict failure did not name the drift violation"; cat strict.log; exit 1; }
          echo "strict lane red as required:"
          grep -E "failed validation|unknown VoiceModelArchitecture" strict.log
