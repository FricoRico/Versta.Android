name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# One active run per ref: retriggering or pushing again cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # upload-artifact on failure

env:
  JAVA_VERSION: "17"

jobs:
  # Kotlin formatting (ktlint) + static analysis (detekt).
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # AGP needs SDK location even for pure Kotlin checks.
      # setup-android v3 defaults to installing the legacy `tools` package,
      # which Google has removed from the SDK repository manifests; skip it
      # (packages: "") and install exactly what we need in the next step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: ktlint
        run: ./gradlew :app:ktlintCheck --console=plain

      - name: detekt
        run: ./gradlew :app:detekt --console=plain

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: "**/build/reports/detekt/*.sarif"
          if-no-files-found: ignore

  # Android lint on a single ABI flavor (findings are ABI-independent).
  android-lint:
    name: android-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: lint
        run: ./gradlew :app:lintArm64-v8aDebug --console=plain

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-*"
          if-no-files-found: ignore

  # Proves the full toolchain (Kotlin + CMake native build) compiles.
  # Heavy (~20+ min cold): the native inference bridge is built from the git
  # submodules. The per-flavour abiFilters in app/build.gradle.kts scope this
  # to one architecture; without it every assemble builds all four ABIs.
  # Kept as a gate so broken native builds never reach develop.
  assemble:
    name: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK, CMake, platform and build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709" "cmake;3.31.6"

      # setup-gradle v4 validates every gradle-wrapper.jar in the tree against
      # Gradle's published checksums. The MNN submodule vendors a flatbuffers
      # *sample* wrapper whose jar has never been published by Gradle, which
      # fails this job before it builds. Allowlist that one pinned checksum;
      # branch: tags/3.6.1 -> d407447, so any edit to the jar changes its hash
      # and fails validation again. The repo's own wrapper is still validated
      # here and, without submodules, in static-analysis and android-lint.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          ALLOWED_GRADLE_WRAPPER_CHECKSUMS: ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04
        with:
          cache-read-only: false
          # Validated in the dedicated step below, which can allow-list
          # wrapper JARs vendored inside submodules.
          validate-wrappers: false

      # The MNN submodule vendors a wrapper JAR inside
      # 3rd_party/flatbuffers/samples/android whose checksum is not in the
      # known list. It is a sample project that is never executed here;
      # allow-list its SHA-256 (pinned by the submodule gitlink).
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04

      - name: Assemble debug (arm64-v8a)
        run: ./gradlew :app:assembleArm64-v8aDebug --console=plain

      # Release variants are only exercised by the release lane; keep the
      # universal-release Kotlin compile covered per commit so a flavour-
      # scoped dependency gap can't escape to publish time (it did once —
      # universalRelease lacked the vendored ONNX Runtime AAR, 2026-10-14).
      - name: Compile universal release Kotlin
        run: ./gradlew :app:compileUniversalReleaseKotlin --console=plain

  # Host-side native tests for the Supertonic 3 engine (app/native/tests):
  # tinyjson, tts.json config contract, token-normalization fuzz. The
  # model-dependent tiers are skipped here (no model files in CI) and run on
  # the dev box / the NEU-68 golden lane instead.
  native-tests:
    name: native-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MNN is ~800 translation units; ccache keeps repeat runs cheap
      # (NEU-16 pattern).
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-tests-${{ runner.os }}

      - name: Configure
        run: |
          cmake -S app/native/tests -B build/native-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/native-tests -j"$(nproc)"

      - name: Run unit tier
        run: ./build/native-tests/supertonic_test
