title: Kaneo team pull request review
description: Coordinator-invoked independent reviews of one exact PR head.
hidden: true
permissions: { on_request: deny }
manager:
  prompt: |
    The coordinator owns the review-round cap, evidence checks and human
    escalation. Start only for the supplied round and exact commit; do not
    ask humans in Paseo, merge, or treat a model verdict as a human approval.
inputs:
  task: { type: string, required: true }
  pr_url: { type: string, required: true }
  head_sha: { type: string, required: true }
  round: { type: number, required: true }
  context: { type: string, required: true }
outputs:
  terra_verdict: { type: enum, values: [approve, changes_requested], value: "{{ steps.review_terra.outputs.verdict }}" }
  terra_comment: { type: string, value: "{{ steps.review_terra.outputs.comment_url }}" }
  terra_findings: { type: string, value: "{{ steps.review_terra.outputs.findings }}" }
  opus_verdict: { type: enum, values: [approve, changes_requested], value: "{{ steps.review_opus.outputs.verdict }}" }
  opus_comment: { type: string, value: "{{ steps.review_opus.outputs.comment_url }}" }
  opus_findings: { type: string, value: "{{ steps.review_opus.outputs.findings }}" }
  terra_council: { type: enum, values: [continue, human], value: "{{ steps.council_terra.outputs.verdict }}" }
  terra_council_notes: { type: string, value: "{{ steps.council_terra.outputs.notes }}" }
  opus_council: { type: enum, values: [continue, human], value: "{{ steps.council_opus.outputs.verdict }}" }
  opus_council_notes: { type: string, value: "{{ steps.council_opus.outputs.notes }}" }
steps:
  - id: review_terra
    role:
      name: reviewer
      agent: { provider: codex, model: gpt-6.1-terra }
      prompt: "Review {{ inputs.pr_url }} at {{ inputs.head_sha }}, round {{ inputs.round }}, for {{ inputs.task }}. Context: {{ inputs.context }}. Name your model GPT-6.1 Terra in the PR comment."
    inputs: [task, pr_url, head_sha, round, context]
    outputs:
      verdict: { type: enum, values: [approve, changes_requested] }
      comment_url: { type: string }
      findings: { type: string }
  - id: review_opus
    role:
      name: reviewer
      agent: { provider: claude, model: claude-opus-5-5 }
      prompt: "Review {{ inputs.pr_url }} at {{ inputs.head_sha }}, round {{ inputs.round }}, for {{ inputs.task }}. Context: {{ inputs.context }}. Name your model Opus 5.5 in the PR comment."
    inputs: [task, pr_url, head_sha, round, context]
    outputs:
      verdict: { type: enum, values: [approve, changes_requested] }
      comment_url: { type: string }
      findings: { type: string }
  - id: council_terra
    needs: [review_terra, review_opus]
    role:
      name: advisor
      agent: { provider: codex, model: gpt-6.1-terra }
      prompt: "Independently check whether the PR {{ inputs.pr_url }} at {{ inputs.head_sha }}, review round {{ inputs.round }}, is becoming overcomplicated or needs a human decision. Context: {{ inputs.context }}. Reviewer findings: {{ inputs.terra_findings }} and {{ inputs.opus_findings }}. Report verdict continue or human and your reasons."
    inputs:
      pr_url: ~
      head_sha: ~
      round: ~
      context: ~
      terra_findings: "{{ steps.review_terra.outputs.findings }}"
      opus_findings: "{{ steps.review_opus.outputs.findings }}"
    outputs:
      verdict: { type: enum, values: [continue, human] }
      notes: { type: string }
  - id: council_opus
    needs: [review_terra, review_opus]
    role:
      name: advisor
      agent: { provider: claude, model: claude-opus-5-5 }
      prompt: "Independently check whether the PR {{ inputs.pr_url }} at {{ inputs.head_sha }}, review round {{ inputs.round }}, is becoming overcomplicated or needs a human decision. Context: {{ inputs.context }}. Reviewer findings: {{ inputs.terra_findings }} and {{ inputs.opus_findings }}. Report verdict continue or human and your reasons."
    inputs:
      pr_url: ~
      head_sha: ~
      round: ~
      context: ~
      terra_findings: "{{ steps.review_terra.outputs.findings }}"
      opus_findings: "{{ steps.review_opus.outputs.findings }}"
    outputs:
      verdict: { type: enum, values: [continue, human] }
      notes: { type: string }
